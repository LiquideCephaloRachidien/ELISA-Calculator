{% extends "base.html" %}
{% block title %}Register · ELISA Studio{% endblock %}
{% block content %}
  <h1>Create an account</h1>
  <form method="post" action="{{ url_for('auth.register') }}" class="narrow">
    <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
    <div>
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="254" required value="{{ email or '' }}">
    </div>
    <div>
      <label for="display-name">Display name</label>
      <input id="display-name" name="display_name" autocomplete="nickname" maxlength="40" required value="{{ display_name or '' }}">
    </div>
    <div>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="new-password" minlength="10" maxlength="128" required aria-describedby="password-hint">
      <p id="password-hint" class="hint">At least 10 characters.</p>
    </div>
    <div>
      <label for="password-confirm">Confirm password</label>
      <input id="password-confirm" name="password_confirm" type="password" autocomplete="new-password" minlength="10" maxlength="128" required>
    </div>
    <button type="submit">Register</button>
  </form>
  <p>Already registered? <a href="{{ url_for('auth.login') }}">Log in</a></p>
{% endblock %}
