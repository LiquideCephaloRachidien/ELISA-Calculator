{% extends "base.html" %}
{% block title %}Log in · ELISA Studio{% endblock %}
{% block content %}
  <h1>Log in</h1>
  <form method="post" action="{{ url_for('auth.login') }}" class="narrow">
    <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
    <input type="hidden" name="next" value="{{ next_url or '' }}">
    <div>
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="254" required value="{{ email or '' }}">
    </div>
    <div>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" minlength="10" maxlength="128" required>
    </div>
    <button type="submit">Log in</button>
  </form>
  <p>No account yet? <a href="{{ url_for('auth.register') }}">Register</a></p>
{% endblock %}
